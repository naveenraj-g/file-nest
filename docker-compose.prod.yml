name: filenest-prod

# All services share one internal network. Only IAM, backend, console, and
# RustFS S3 port are bound to the host — everything else is internal only.

networks:
  filenest_net:
    driver: bridge

volumes:
  postgres_data:
  rustfs_data:

services:

  # ── Shared PostgreSQL (two databases: filenest + iam_db) ─────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: filenest
      POSTGRES_USER: filenest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filenest}
      IAM_POSTGRES_PASSWORD: ${IAM_POSTGRES_PASSWORD:-iam_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - filenest_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filenest -d filenest"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - filenest_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── NATS JetStream ────────────────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: -js -m 8222
    networks:
      - filenest_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── ClamAV ───────────────────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    networks:
      - filenest_net
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── RustFS (S3-compatible object storage) ─────────────────────────────────────
  # Port 9000 is exposed so clients can reach presigned URLs directly.
  # Port 9001 (admin console) is intentionally NOT exposed — access via SSH tunnel.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
    volumes:
      - rustfs_data:/data
    networks:
      - filenest_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── IAM (BetterAuth OAuth 2.1 server) ────────────────────────────────────────
  # First deploy: after the container is running, seed the superadmin once:
  #   docker compose -f docker-compose.prod.yml exec iam pnpm seed:admin
  iam:
    image: ghcr.io/naveenraj-g/file-nest/iam:latest
    build:
      context: ./iam
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    env_file:
      - ./iam/.env
    environment:
      # Override connection string to use the Docker service name
      DATABASE_URL: postgresql://iam_user:${IAM_POSTGRES_PASSWORD:-iam_password}@postgres:5432/iam_db
    ports:
      - "5000:5000"
    networks:
      - filenest_net
    depends_on:
      postgres:
        condition: service_healthy

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/naveenraj-g/file-nest/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENV: production
      # Override connection strings to use Docker service names instead of localhost
      DATABASE_PRIMARY_URL: postgresql+asyncpg://filenest:${POSTGRES_PASSWORD:-filenest}@postgres:5432/filenest
      DATABASE_REPLICA_URL: postgresql+asyncpg://filenest:${POSTGRES_PASSWORD:-filenest}@postgres:5432/filenest
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      IAM_URL: http://iam:5000
      # Do NOT override RUSTFS_ENDPOINT_URL here. It must be the public hostname
      # (e.g. http://your-server-ip:9000) so that presigned URLs generated by the
      # backend are reachable by clients. Set it in backend/.env.
    ports:
      - "8000:8000"
    networks:
      - filenest_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      clamav:
        condition: service_started

  # ── Console app (Next.js) ─────────────────────────────────────────────────────
  # Excluded from the default deploy. Start it once the IAM OAuth client is created:
  #   docker compose -f docker-compose.prod.yml --profile console up -d console
  # NEXT_PUBLIC_* vars are baked at build time — rebuild the image if they change.
  console:
    profiles: [console]
    image: ghcr.io/naveenraj-g/file-nest/console:latest
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL}
        NEXT_PUBLIC_BETTER_AUTH_CLIENT_ID: ${NEXT_PUBLIC_BETTER_AUTH_CLIENT_ID}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    env_file:
      - ./frontend/web/.env
    ports:
      - "3000:3000"
    networks:
      - filenest_net
    depends_on:
      - iam
      - backend
